<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ data.name }}{% endblock %}</title>
    <script>
        /* apply the saved sidebar state before first paint; with no saved choice, phones start collapsed */
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('nav-collapsed'); } catch (e) {}
            if (saved === '1' || (saved === null && window.matchMedia('(max-width: 768px)').matches))
                document.documentElement.classList.add('nav-collapsed');
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>
<body class="{{ request.endpoint }}">
    <nav class="navbar" id="site-nav">
        <button type="button" class="nav-toggle" aria-controls="site-nav-links" aria-label="Hide menu" aria-expanded="true"></button>
        <div class="nav-container" id="site-nav-links">
            <a href="/" class="nav-link">Home</a>
            {% if request.endpoint == 'index' %}
            <ul class="nav-menu">
                <li class="nav-link">
                    <a href="#experience" class="nav-link">Experience</a>
                </li>
                <li class="nav-link">
                    <a href="#projects" class="nav-link">Projects</a>
                </li>
                <li class="nav-link dropdown">
                    <a href="#" class="nav-link">Misc.</a>
                    <div class="dropdown-content">
                        <a href="{{ url_for('listening_history') }}">Listening</a>
                        <a href="{{ url_for('concert_history') }}">Concerts</a>
                        <a href="{{ url_for('photos') }}">Photos</a>
                    </div>
                </li>
            </ul>
            {% else %}
            <ul class="nav-menu">
                    <li class="nav-link dropdown">
                    <a href="#" class="nav-link">Misc.</a>
                    <div class="dropdown-content">
                        <a href="{{ url_for('listening_history') }}">Listening</a>
                        <a href="{{ url_for('concert_history') }}">Concerts</a>
                        <a href="{{ url_for('photos') }}">Photos</a>
                    </div>
                </li>
            </ul>
            {% endif %}
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
